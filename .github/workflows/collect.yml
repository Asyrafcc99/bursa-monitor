name: Collect prices and news

on:
  schedule:
    # GitHub uses UTC. KL = UTC+8. Runs every 5 min, Mon-Fri, around both Bursa sessions.
    # 01:00-04:55 UTC = 09:00-12:55 KL; 06:30-09:05 UTC = 14:30-17:05 KL. The script skips exact off-hours.
    - cron: "*/5 1-4 * * 1-5"
    - cron: "30-59/5 6 * * 1-5"
    - cron: "*/5 7-8 * * 1-5"
    - cron: "0,5 9 * * 1-5"
  workflow_dispatch: {}   # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python collector/collect.py --force
          else
            python collector/collect.py
          fi
      - name: Save results
        run: |
          git config user.name "bursa-monitor bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update data" && git push)
