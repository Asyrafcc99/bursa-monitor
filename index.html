<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bursa Monitor</title>
<meta name="description" content="Personal Bursa Malaysia coverage dashboard">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Bursa Monitor</div>
  <div class="status" id="status">Loading…</div>
  <div class="actions">
    <button id="refreshBtn" title="Reload data">↻ Refresh</button>
    <button id="customizeBtn">⚙ Customize</button>
  </div>
</header>
<nav class="filters">
  <div class="chips" id="sectorChips"></div>
  <input id="search" type="search" placeholder="Search stock or news…" autocomplete="off">
</nav>
<main id="panels"></main>
<footer>Personal research tool, not financial advice. Prices: Yahoo Finance, delayed about 15 minutes. News: Google News. Data never filled in when missing. <a href="https://github.com/Asyrafcc99/bursa-monitor/blob/main/docs/HOW-TO.md" target="_blank" rel="noopener">How to add stocks / change alerts</a>.</footer>

<div class="overlay" id="drawerOverlay" hidden>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside>
</div>
<div class="overlay" id="customOverlay" hidden>
  <div class="dialog" id="customDialog" role="dialog" aria-modal="true"></div>
</div>

<script src="assets/common.js"></script>
<script src="assets/panels.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
