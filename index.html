<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bursa Monitor</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#666; --line:#ddd; --up:#0a7a2f; --down:#c0262d; --warn:#9a6700; --new:#fff4c2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eee; --muted:#999; --line:#333; --up:#4cc76f; --down:#ff6b6b; --warn:#e3b341; --new:#3a3200; } }
  body { margin:0; padding:16px; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:15px; margin:20px 0 8px; color:var(--muted); letter-spacing:.04em; }
  .card { padding:8px 12px !important; margin-bottom:8px !important; }
  summary { cursor:pointer; font-size:12px; color:var(--muted); margin-top:4px; }
  .meta { color:var(--muted); margin-bottom:16px; }
  .warn { color:var(--warn); font-weight:600; }
  .card { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
  .top { display:flex; flex-wrap:wrap; gap:4px 16px; align-items:baseline; }
  .name { font-weight:700; font-size:16px; }
  .price { font-size:18px; font-weight:700; }
  .up { color:var(--up); } .down { color:var(--down); }
  .small { color:var(--muted); font-size:12px; }
  ul { margin:8px 0 0; padding-left:18px; }
  li.new { background:var(--new); }
  a { color:inherit; }
</style>
</head>
<body>
<h1>Bursa Monitor</h1>
<div class="meta" id="meta">Loading…</div>
<div id="list"></div>
<p class="small">Personal research tool. Not financial advice. Prices from Yahoo Finance, delayed about 15 minutes. News from Google News.</p>
<script>
const fmt = n => n == null ? "–" : Number(n).toLocaleString("en-MY");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem("seenNews") || "[]")); } catch (e) {}

fetch("data/latest.json?t=" + Date.now()).then(r => {
  if (!r.ok) throw new Error("No data file yet");
  return r.json();
}).then(d => {
  const ageMin = (Date.now() - new Date(d.collected_at_kl)) / 60000;
  document.getElementById("meta").innerHTML =
    "Last collected: " + esc(d.collected_at_kl.replace("T", " ")) + " (KL time)" +
    (ageMin > 30 ? ' <span class="warn">· ' + Math.round(ageMin) + " min old (normal outside market hours)</span>" : "");
  const nowSeen = [];
  const sectors = [...new Set(d.stocks.map(s => s.sector))];
  document.getElementById("list").innerHTML = sectors.map(sec => '<h2>' + esc(sec) + '</h2>' + d.stocks.filter(s => s.sector === sec).map(s => {
    const q = s.quote || {};
    let priceHtml;
    if (q.error) priceHtml = '<span class="warn">' + esc(q.error) + "</span>";
    else {
      const cls = q.change_pct > 0 ? "up" : q.change_pct < 0 ? "down" : "";
      priceHtml = '<span class="price">RM ' + q.price.toFixed(3) + '</span> <span class="' + cls + '">' +
        (q.change_pct > 0 ? "+" : "") + q.change_pct.toFixed(2) + "%</span>" +
        ' <span class="small">Vol ' + fmt(q.volume) + " · as of " + esc((q.price_time_kl || "unknown time").replace("T", " ")) +
        " KL · " + esc(q.delayed) + " (" + esc(q.source) + ")</span>";
    }
    let newCount = 0;
    const news = (s.news || []).map(n => {
      nowSeen.push(n.link);
      const isNew = seen.size && !seen.has(n.link);
      if (isNew) newCount++;
      return '<li class="' + (isNew ? "new" : "") + '"><a href="' + esc(n.link) + '" target="_blank" rel="noopener">' +
        esc(n.title) + '</a> <span class="small">' + esc(n.published) + "</span></li>";
    }).join("");
    const newsBlock = news
      ? '<details' + (newCount ? " open" : "") + '><summary>News (' + (s.news || []).length + (newCount ? ", " + newCount + " new" : "") + ')</summary><ul>' + news + '</ul></details>'
      : '<div class="small">' + esc(s.news_error || "No news in the last 7 days.") + "</div>";
    return '<div class="card"><div class="top"><span class="name">' + esc(s.short) + " (" + esc(s.code) + ')</span>' + priceHtml + "</div>" +
      '<div class="small"><a href="' + esc(s.klsescreener_url) + '" target="_blank" rel="noopener">Open in KLSE Screener</a></div>' + newsBlock + "</div>";
  }).join("")).join("");
  try { localStorage.setItem("seenNews", JSON.stringify([...new Set([...seen, ...nowSeen])].slice(-500))); } catch (e) {}
}).catch(e => {
  document.getElementById("meta").innerHTML = '<span class="warn">No data yet: ' + esc(e.message) + "</span>";
});
</script>
</body>
</html>
